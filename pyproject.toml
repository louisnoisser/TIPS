[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gba-ops-reanalysis"
version = "0.1.0"
description = "Reusable G-BA XML workflows for OPS/ICD center extraction, geocoding, isochrone generation, urban-rural analysis, and longitudinal summaries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.1,<2.0",
  "PyYAML>=6,<7",
  "fastapi>=0.115,<1.0",
  "geopandas>=1.0,<2.0",
  "geopy>=2.4,<3.0",
  "matplotlib>=3.8,<4.0",
  "numpy>=1.24,<3.0",
  "openrouteservice>=2.3,<3.0",
  "pandas>=2.0,<3.0",
  "pyproj>=3.6,<4.0",
  "rasterio>=1.3,<2.0",
  "requests>=2.32,<3.0",
  "shapely>=2.0,<3.0",
  "uvicorn>=0.30,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gba_ops_reanalysis = ["dashboard_assets/*", "webapp_assets/*"]
